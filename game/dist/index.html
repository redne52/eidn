<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Edin</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#120e0a;color:#f3e6c8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;touch-action:none}
#app{position:fixed;inset:0}
#gl{position:fixed;inset:0;display:block;z-index:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:1}
#ui *{pointer-events:auto}
#ui .scr,#ui .battle,#ui .floats,#ui .tags{pointer-events:none}
#ui .scr>*,#ui .battle>*{pointer-events:auto}
#ui .floats *,#ui .tags *{pointer-events:none}
:root{--lap:#1f4fa8;--lapd:#132f66;--gold:#e0b04a;--goldd:#a57a22;--sand:#f3e6c8;--ink:#1a140d;--panel:rgba(18,26,48,.86);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
.btn{font:inherit;font-weight:700;color:var(--sand);background:linear-gradient(#2a5bbf,#173a80);border:2px solid #0d2350;border-radius:10px;min-height:44px;padding:0 16px;box-shadow:0 3px 0 #0b1c40,inset 0 1px 0 rgba(255,255,255,.25);letter-spacing:.3px;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1c40}
.btn.gold{background:linear-gradient(#f2c95c,#c08a2a);color:#2a1a05;border-color:#7a5512;box-shadow:0 3px 0 #6b4a10,inset 0 1px 0 rgba(255,255,255,.5)}
.btn.big{min-height:50px;font-size:16px;padding:0 26px}
.btn.icon{min-width:44px;padding:0;font-size:18px}
.btn.sm{min-height:36px;min-width:44px;padding:0 10px}
.btn.off{opacity:.45;filter:grayscale(.6)}
.btn.danger{background:linear-gradient(#c44,#822);border-color:#511}
.grade{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;color:#111;font-weight:900;font-size:12px;text-align:center;margin-left:6px;box-shadow:0 0 8px rgba(255,255,255,.25)}
.grade.big{font-size:22px;padding:4px 14px;border-radius:10px}
.note{font-size:12px;opacity:.8}
.scr{position:absolute;inset:0}
.ic{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:4px;background:#888}
.ic-sekel{background:radial-gradient(circle at 35% 35%,#ffe9a0,#c08a2a 60%,#6b4a10)}
.ic-can_iksiri{background:radial-gradient(circle at 35% 35%,#ff9a9a,#c22 60%,#600);border-radius:40% 40% 50% 50%}
.ic-bandaj{background:repeating-linear-gradient(45deg,#f3ead6 0 4px,#d8cbb0 4px 7px);border-radius:4px}
.ic-panzehir{background:radial-gradient(circle at 35% 35%,#b6ffb0,#2b9a3a 60%,#0d4416);border-radius:40% 40% 50% 50%}
.ic-donus_tableti{background:linear-gradient(#c9a46a,#8b6a3a);border-radius:3px}

/* yan çevir uyarısı */
#rotate{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#120e0a;text-align:center;font-size:18px;padding:30px}
#rotate .ph{width:46px;height:78px;border:4px solid var(--gold);border-radius:9px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}

/* açılış */
.title{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9vh;gap:14px;background:linear-gradient(transparent 40%,rgba(10,8,5,.55))}
.logo{position:absolute;top:8vh;left:0;right:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:min(16vh,74px);font-weight:900;letter-spacing:12px;color:#ffe3a0;text-shadow:0 0 18px rgba(255,190,80,.6),0 4px 0 #6b3d10,0 6px 14px #000}
.logo small{display:block;font-size:14px;letter-spacing:4px;font-weight:600;color:#fff4d6;text-shadow:0 2px 6px #000}
.row{display:flex;gap:12px}
.sndb{position:absolute;right:calc(12px + var(--safe-r));top:10px}
.story{display:flex;align-items:center;justify-content:center;background:rgba(5,4,3,.82);transition:opacity .4s}
.story p{font-family:Georgia,serif;font-size:20px;max-width:560px;text-align:center;line-height:1.5;color:#ffe3a0;animation:fadein 1s}
.story.out{opacity:0}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* yumurta seçimi */
.eggs .head{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-size:20px;color:#ffe3a0;text-shadow:0 2px 6px #000}
.cards{position:absolute;bottom:62px;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--panel);border:2px solid rgba(224,176,74,.35);border-radius:12px;padding:7px 9px;min-height:86px;cursor:pointer;transition:.15s}
.card b{font-size:15px;color:#ffe3a0}
.card p{font-size:11.5px;line-height:1.3;margin:3px 0;opacity:.92}
.card small{font-size:10.5px;opacity:.7}
.card.on{border-color:var(--gold);box-shadow:0 0 14px rgba(224,176,74,.55);transform:translateY(-4px)}
.role{float:right;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#555}
.r-hasar{background:#b5342b}.r-zehir{background:#5e8a1f}.r-iyilestirme{background:#2d8c8a}.r-savunma{background:#7a5a2c}
.eggs .foot{position:absolute;bottom:8px;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));display:flex;align-items:center;justify-content:space-between}
.bond.off{opacity:.4;pointer-events:none}
.banner{display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px}
.bn{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;animation:fadein .5s}
.bn b{font-size:20px;color:#ffe3a0}.bn small{max-width:220px;font-size:12px;opacity:.85}

/* kapı */
.gpanel{position:absolute;left:calc(10px + var(--safe-l));top:10px;width:230px;background:var(--panel);border:2px solid rgba(224,176,74,.4);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.gname b{font-size:17px;color:#ffe3a0}
.glv{font-size:12px}.glv b{font-size:20px;color:#fff}.glv span{opacity:.6;margin-left:3px}
.xp{position:relative;height:16px;background:#0b1430;border-radius:8px;overflow:hidden;border:1px solid #000}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7d5cff,#c69bff)}
.xp span{position:absolute;inset:0;font-size:10.5px;text-align:center;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
.money{font-weight:700}.kader,.egginc{font-size:12px;color:#c9b2ff}
.goal{position:absolute;top:12px;right:calc(12px + var(--safe-r));max-width:260px;background:rgba(0,0,0,.45);border-left:3px solid var(--gold);padding:6px 10px;border-radius:6px;font-size:12px}
.gmenu{position:absolute;bottom:10px;right:calc(10px + var(--safe-r));display:flex;gap:8px;align-items:center}

/* paneller */
.panel{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);pointer-events:auto!important}
.pbox{width:min(560px,92vw);max-height:92vh;background:linear-gradient(#1b2a52,#111a33);border:2px solid var(--gold);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;animation:fadein .2s}
.phead{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 14px;background:rgba(0,0,0,.25)}
.phead b{font-size:16px;color:#ffe3a0}
.pbody{padding:10px 14px;display:flex;flex-direction:column;gap:7px;overflow:auto}
.zlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zcard{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:2px solid rgba(255,255,255,.2);min-height:120px}
.zcard b{font-size:16px}.zcard span{font-size:12px}.zcard em{font-style:normal;font-weight:800;color:#ffcf6a}
.z-kiyi{background:linear-gradient(#3f8fb0,#a88a52)}.z-bozkir{background:linear-gradient(#c79f5f,#7a5a2c)}.z-derin{background:linear-gradient(#4b3f5e,#1c1530)}
.zcard.locked{filter:grayscale(.9) brightness(.55);cursor:default}
.zcard small{margin-top:auto;font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:rgba(0,0,0,.3);border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between}
.stats b{color:#ffe3a0}
.skills{display:flex;flex-direction:column;gap:5px}
.sk{background:rgba(255,255,255,.07);border-radius:8px;padding:5px 9px}.sk b{color:#ffe3a0}.sk small{display:block;opacity:.75;font-size:11px}
.sk.lock{opacity:.4}
.irow{display:grid;grid-template-columns:22px 1fr auto auto auto auto;gap:8px;align-items:center;background:rgba(0,0,0,.25);border-radius:8px;padding:4px 8px}
.irow b{font-size:13px}.irow span{font-size:12px;opacity:.85}
.invgrid{display:flex;flex-wrap:wrap;gap:6px}.slot{background:rgba(0,0,0,.3);border-radius:8px;padding:6px 9px;font-size:12px}
.lbl{font-size:12px;opacity:.75;margin-bottom:2px}
.beltedit{display:flex;flex-direction:column;gap:5px}

/* harita HUD */
.tl{position:absolute;left:calc(10px + var(--safe-l));top:8px;display:flex;flex-direction:column;gap:4px;width:230px}
.hpw .nm{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.hp{position:relative;height:15px;background:#2a0d0d;border:1px solid #000;border-radius:8px;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#6fe07a,#2f9a3e);transition:width .25s}
.hp.low i{background:linear-gradient(#ff7a6a,#c22)}
.hp em{display:none}
.hp span{position:absolute;inset:0;font-size:10.5px;line-height:14px;text-align:center;font-weight:800;text-shadow:0 1px 2px #000}
.oz{display:flex;align-items:baseline;gap:8px;background:rgba(40,20,80,.55);border:1px solid rgba(180,150,255,.5);border-radius:10px;padding:2px 10px;width:max-content}
.oz .ozl{font-size:11px;opacity:.85}.oz b{font-size:22px;color:#d6c2ff;text-shadow:0 0 10px #8a5cff}
.oz.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25);box-shadow:0 0 18px #9b7bff}}
.zinfo{font-size:11.5px;text-shadow:0 1px 3px #000}.zinfo em{color:#8ff0a0;font-style:normal}
.mini{position:absolute;right:calc(10px + var(--safe-r));top:8px;width:96px;height:96px;border:2px solid rgba(224,176,74,.6);border-radius:10px}
.joy{position:absolute;left:calc(22px + var(--safe-l));bottom:20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.12),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.25);touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7dc,#e0b04a);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none!important}
.br{position:absolute;right:calc(14px + var(--safe-r));bottom:16px;display:flex;gap:12px;align-items:flex-end}
.round{border-radius:50%;min-width:0;width:74px;height:74px;padding:0;position:relative;overflow:hidden;font-size:12px;line-height:1.1}
.round span{position:relative;z-index:1}
.ret i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(111,215,255,.55)}
.ret.casting{border-color:#6fd7ff;box-shadow:0 0 16px #6fd7ff}
/* Saldır düğmesi yer kaplamaya devam eder: görünüp kaybolurken Dönüş büyüsü düğmesi parmağın altına kaymasın */
.attack{width:92px;height:92px;font-size:16px;background:linear-gradient(#e2513f,#8f1f14);border-color:#4a0d07;box-shadow:0 3px 0 #3a0a05;visibility:hidden;opacity:0;transition:opacity .15s}
#ui .attack:not(.show){pointer-events:none!important}
.attack.show{visibility:visible;opacity:1;animation:pulse 1s infinite}
.attack.boss{background:linear-gradient(#7a2bd0,#3a0f6e)}
@keyframes pulse{50%{transform:scale(1.06)}}
.toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid var(--gold);border-radius:10px;padding:6px 14px;font-size:13px;opacity:0;transition:.3s;max-width:70vw;text-align:center}
.toast.show{opacity:1}
.tags{position:absolute;inset:0;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.tag.boss{font-size:13px}
.tag.near{font-size:13px;filter:drop-shadow(0 0 4px #fff)}

/* sonuç ekranları */
.result{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.rbox{min-width:300px;background:linear-gradient(#1b2a52,#111a33);border:2px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadein .3s}
.rt{font-family:Georgia,serif;font-size:28px;font-weight:900;color:#ffe3a0;text-shadow:0 0 12px rgba(255,190,80,.6)}
.lose .rt{color:#ff9b8a;text-shadow:0 0 12px rgba(255,80,60,.6)}
.rgain{display:flex;flex-direction:column;align-items:center}.rgain span{font-size:12px;opacity:.8}.rgain b{font-size:30px;color:#d6c2ff;text-shadow:0 0 12px #8a5cff}
.rgain.lost b{font-size:20px;color:#ffb3a6;text-shadow:none}
.rrow{font-size:13px}.eggd{color:#ffe08a;font-weight:800}
.rnote{font-size:12px;opacity:.85;max-width:340px;text-align:center}
.levelup .rt{font-size:38px;animation:lvl 1s ease-out}
.levelup::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,216,74,.5),transparent 60%);animation:lvlg 1.2s ease-out forwards;pointer-events:none}
@keyframes lvl{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
@keyframes lvlg{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(1.6)}}

/* savaş */
.battle{position:absolute;inset:0;transition:opacity .35s}
.battle.out{opacity:0}
.bbar{position:absolute;top:8px;width:min(300px,38vw);background:rgba(10,14,30,.7);border:1px solid rgba(224,176,74,.4);border-radius:10px;padding:4px 8px}
.bbar.left{left:calc(8px + var(--safe-l))}.bbar.right{right:calc(8px + var(--safe-r))}
.bname{font-size:13px;display:flex;align-items:center;gap:4px}.bname b{color:#ffe3a0}.blv{opacity:.75;font-size:11px}
.bossb{background:#7a2bd0;font-size:10px;font-weight:900;padding:1px 6px;border-radius:5px}
.bbar .hp{height:14px;margin-top:3px}
.sts{height:16px;font-size:13px;display:flex;gap:3px}
.blog{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:min(420px,60vw);font-size:11.5px;text-align:center;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;gap:1px}
.blog div:first-child{opacity:.6}
.btimer{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:44px}
.btimer svg{width:100%;height:100%;transform:rotate(-90deg)}
.btimer circle{fill:none;stroke-width:4}.tbg{stroke:rgba(0,0,0,.5)}.tfg{stroke:var(--gold);stroke-dasharray:94.2;transition:stroke-dashoffset .1s linear}
.btimer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.btimer.warn .tfg{stroke:#ff5a4e}.btimer.hide{opacity:.25}
.bpanel{position:absolute;left:calc(6px + var(--safe-l));right:calc(6px + var(--safe-r));bottom:6px;display:flex;gap:6px;align-items:flex-end;justify-content:space-between}
.bpanel.busy{opacity:.72}
.zbox{background:rgba(10,14,30,.72);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:3px 5px 5px;flex:0 0 auto}
.zt{font-size:10.5px;font-weight:900;letter-spacing:1px;text-align:center;opacity:.85}
.zbox.atk .zt{color:#ff9b8a}.zbox.grd .zt{color:#9fd0ff}
.zg{display:grid;grid-template-columns:repeat(2,64px);gap:4px}
.zbtn{font:inherit;font-size:12px;font-weight:800;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:var(--sand);cursor:pointer}
.atk .zbtn.on{background:#b5342b;border-color:#ffb3a6;box-shadow:0 0 10px #ff5a4e}
.grd .zbtn.on{background:#1f4fa8;border-color:#9fd0ff;box-shadow:0 0 10px #4fa0ff}
.zbox.pulse{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold)}}
.bmid{display:flex;flex-direction:column;gap:5px;align-items:center;flex:1;min-width:0}
.acts,.beltrow{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap}
.act{font:inherit;font-size:11.5px;font-weight:800;min-width:58px;max-width:92px;height:44px;padding:0 6px;border-radius:9px;border:2px solid #0d2350;background:linear-gradient(#2a5bbf,#173a80);color:var(--sand);position:relative;line-height:1.05;cursor:pointer;overflow:hidden}
.act small{position:absolute;right:2px;top:1px;font-size:10px;background:#000a;border-radius:4px;padding:0 3px}
.act.on{background:linear-gradient(#f2c95c,#c08a2a);color:#2a1a05;border-color:#7a5512}
.act.off{opacity:.38}
.confirm{font:inherit;font-weight:900;font-size:13px;height:44px;padding:0 14px;border-radius:9px;border:2px solid #444;background:#555;color:#ddd;cursor:pointer}
.confirm.ready{background:linear-gradient(#6fe07a,#2f9a3e);border-color:#145a1f;color:#052;animation:pulse 1s infinite}
.pocket{width:44px;height:44px;border-radius:9px;border:2px dashed rgba(255,255,255,.25);background:rgba(0,0,0,.35);position:relative;cursor:pointer}
.pocket .ic{width:24px;height:24px;margin:0}
.pocket small{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:900}
.pocket.on{border:2px solid var(--gold);box-shadow:0 0 8px var(--gold)}
.pocket.empty{opacity:.4;cursor:default}
.autob{font:inherit;font-size:11.5px;font-weight:800;height:44px;padding:0 10px;border-radius:9px;border:2px solid #4a3a7a;background:rgba(60,40,120,.75);color:#e8dcff;cursor:pointer;white-space:nowrap}
.autob.on{background:#8a5cff;color:#fff}
.bhint{position:absolute;top:104px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid var(--gold);border-radius:8px;padding:4px 12px;font-size:12.5px;font-weight:700;color:#ffe3a0;white-space:nowrap}
.floats{position:absolute;inset:0;overflow:hidden}
.fnum{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:18px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fly 1.25s ease-out forwards;white-space:nowrap}
.fnum.crit{font-size:28px;color:#ffd84a;animation:flyc 1.25s ease-out forwards}
.fnum.block{color:#b9c2cc;font-size:15px}.fnum.dodge{color:#9fe8ff;font-size:16px}
.fnum.heal{color:#6fe0a0}.fnum.status{color:#e5c8ff;font-size:14px}.fnum.skill{color:#ffcf6a;font-size:15px;top:auto}
.fnum.dot.zehir{color:#7cf07c}.fnum.dot.kanama{color:#ff6b6b}.fnum.dot.yanik{color:#ffa84a}
@keyframes fly{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
@keyframes flyc{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1);margin-top:-46px}}

@media (max-height:380px){
  .zg{grid-template-columns:repeat(2,58px)}
  .act{min-width:52px;font-size:11px}
  .gpanel{width:210px;padding:7px 9px}
}
@media (max-width:760px){.zg{grid-template-columns:repeat(2,52px)}.act{min-width:48px;max-width:70px}}
/* entegrasyon: kemer cepleri, çanta ve yumurta listesi */
.bpockets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bpocket{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(0,0,0,.3);border:1px solid rgba(224,176,74,.5);border-radius:9px;padding:5px 4px;min-width:0}
.bpocket.empty{border-style:dashed;opacity:.85}
.bpocket b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bpocket small{font-size:11px;opacity:.8}
.bpocket select{width:100%;font-size:12px;min-height:30px;border-radius:6px;background:#0d1530;color:#f3e6c4;border:1px solid rgba(224,176,74,.5)}
.invgrid .irow,.eggs-list .irow{grid-template-columns:22px 1fr auto auto;width:100%}
.invgrid{flex-direction:column;flex-wrap:nowrap}
.eggs-list{display:flex;flex-direction:column;gap:5px}

.bpanel.v2{align-items:center;gap:8px}
.moves{display:flex;gap:6px}
.mv{font:inherit;font-weight:800;font-size:12px;min-width:66px;height:50px;border-radius:10px;border:2px solid #0d2350;background:linear-gradient(#2a5bbf,#173a80);color:var(--sand);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:pointer;position:relative;box-shadow:0 3px 0 #0b1c40}

.mv.glow{border-color:#ffd84a;animation:mvglow .9s infinite}

.mv.warn{border-color:#ff4a3a;animation:mvwarn .6s infinite}
@keyframes mvwarn{0%,100%{box-shadow:0 0 0 0 rgba(255,74,58,.9)}50%{box-shadow:0 0 16px 4px rgba(255,180,60,.9)}}
.mv-fin{min-width:76px;background:linear-gradient(#5a2a14,#2e1408);border-color:#7a3a10;color:#ffcf9a}
.mv-fin small{position:absolute;right:4px;top:2px;font-size:10px;background:#000a;border-radius:4px;padding:0 3px}
.mv-fin.full{background:linear-gradient(#ffb347,#e2501a);color:#2a0a00;border-color:#ffe39a;animation:mvglow .7s infinite}

.bside{display:flex;gap:6px;align-items:center}
.bside .beltrow{gap:5px}
.fleeb{font:inherit;font-size:12px;font-weight:800;height:44px;min-width:48px;border-radius:9px;border:2px solid #511;background:linear-gradient(#8a3a3a,#5a1f1f);color:#ffd8d0;cursor:pointer}
.tele{position:absolute;transform:translate(-50%,-100%);display:none;align-items:center;gap:6px;background:rgba(120,10,10,.85);border:2px solid #ff5a4e;border-radius:10px;padding:3px 10px 3px 4px;font-weight:900;font-size:12px;color:#ffe0d8;white-space:nowrap;animation:telep .6s infinite alternate;pointer-events:none}
.tele b{width:22px;height:22px;border-radius:50%;background:#ff3b2f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
@keyframes telep{from{box-shadow:0 0 4px #ff3b2f}to{box-shadow:0 0 16px #ff3b2f}}
.bigname{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-weight:900;font-size:30px;color:#ffe39a;text-shadow:0 3px 0 #6b2a0a,0 0 18px #ff8a2a;letter-spacing:1px;pointer-events:none;white-space:nowrap;transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1)}
.bigname.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.bigname.fin{color:#fff0c0}.bigname.f3{font-size:34px}.bigname.f4{font-size:38px}.bigname.f5{font-size:44px;text-shadow:0 3px 0 #6b0a0a,0 0 28px #ff3a1a}
.fnum.counter{color:#9fd0ff;font-size:22px}.fnum.heavy{font-size:22px}
@media (max-width:760px){.mv{min-width:58px;font-size:11px}.mv-fin{min-width:64px}.autob{font-size:10.5px;padding:0 7px}.chain .cn{min-width:70px}}
/* v3: savaş efektleri ve okunurluk */
.bigname{top:33%}
.bflash{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
.bflash.go{animation:bflash .28s ease-out forwards}
@keyframes bflash{0%{opacity:var(--a,.5)}100%{opacity:0}}
.fnum{z-index:2}.bigname{z-index:3}
.pips i{transition:background .12s,box-shadow .12s}
.mv-fin small{min-width:22px;text-align:center}
.pbody.grid2{display:grid;grid-template-columns:1fr 1fr}
/* Dokunma düzeltmesi: tam ekran efekt katmanları ve yazılar dokunuşları asla yutmasın (#ui .battle>* kuralını ezer) */
#ui .battle .bflash,#ui .battle .bigname,#ui .battle .tele,#ui .battle .chains,#ui .battle .floats,#ui .levelup::before{pointer-events:none!important}

/* Kamera: pusula düğmesi (mini haritanın altında) */
.compass{position:absolute;right:calc(10px + var(--safe-r));top:112px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(224,176,74,.7);background:radial-gradient(#22304f,#101a30);display:grid;place-items:center;cursor:pointer;padding:0}
.compass .needle{position:absolute;inset:6px;display:block;transition:none}
.compass .needle::before{content:'';position:absolute;left:50%;top:0;width:0;height:0;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:14px solid #e84a3a}
.compass .needle::after{content:'';position:absolute;left:50%;bottom:0;width:0;height:0;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:14px solid #d8d0bc}
.compass b{position:relative;font-size:10px;color:var(--gold);text-shadow:0 1px 2px #000}
.compass:active{transform:scale(.94)}
#ui .hud .toast{pointer-events:none}
/* v4: ruh özü emme katmanı */
#ui .absorbtap{position:absolute;inset:0;pointer-events:auto;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,20,30,.35));}
#ui .absorbtap .ahint{font-size:12px;color:#bff6ff;background:rgba(8,30,40,.55);border:1px solid rgba(110,230,255,.35);padding:5px 12px;border-radius:14px;letter-spacing:.3px;animation:apulse 1.4s ease-in-out infinite}
#ui .absorbtap.fast .ahint{color:#fff;border-color:#7ff0ff}
@keyframes apulse{50%{opacity:.55}}
#ui .ozgain{position:absolute;z-index:31;pointer-events:none!important;transform:translate(-50%,-50%) scale(.6);opacity:0;font:800 26px/1 system-ui,sans-serif;color:#9ff8ff;text-shadow:0 0 12px #2fd8ff,0 2px 0 #06303a;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#ui .ozgain.show{opacity:1;transform:translate(-50%,-140%) scale(1)}
/* ---------- v4 Tur 3: kaynak, yemek, kamp ---------- */
.actslot{position:relative;width:92px;height:92px}
.actslot>.round{position:absolute;left:0;top:0}
.gather,.campb{width:92px;height:92px;font-size:15px;visibility:hidden;opacity:0;transition:opacity .15s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gather{background:linear-gradient(#5fb55a,#2a6a26);border-color:#173d14;box-shadow:0 3px 0 #10300e}

.gather small,.campb small{display:block;font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
#ui .gather:not(.show),#ui .campb:not(.show){pointer-events:none!important}
.gather.show,.campb.show{visibility:visible;opacity:1;animation:pulse 1.2s infinite}
.bagb{width:58px;height:58px;font-size:12px;background:linear-gradient(#8a6a3a,#5a3e1a);border-color:#3a2608;box-shadow:0 3px 0 #2a1a05}
.bagb .bagn{position:absolute;top:4px;right:6px;z-index:2;font-style:normal;font-size:11px;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:#e0513f;color:#fff;font-weight:800}
.actbar{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:min(300px,50vw);height:26px;border-radius:13px;background:rgba(0,0,0,.55);border:2px solid var(--gold);overflow:hidden;display:none;pointer-events:none}
.actbar.show{display:block}
.actbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#5fb55a,#c6f07a);opacity:.85}
.actbar span{position:relative;z-index:1;display:block;text-align:center;font-size:12px;line-height:22px;font-weight:700;text-shadow:0 1px 2px #000}
.buffb{font-size:11px;color:#ffc07a;margin-top:2px;text-shadow:0 1px 2px #000}
.hp.fill i{background:linear-gradient(90deg,#5fe0a0,#b8ff9a)!important}
.ic-cig_et{background:radial-gradient(circle at 40% 40%,#f08a80,#b0302a 60%,#5a1410);border-radius:45% 55% 50% 40%}
.ic-sifali_ot{background:radial-gradient(circle at 50% 80%,#c6f07a,#4f9a30 60%,#1f4a10);border-radius:50% 50% 20% 20%}
.ic-sifali_meyve{background:radial-gradient(circle at 35% 35%,#ffc08a,#e0402a 55%,#6a1008);border-radius:50%}
.ic-ruh_mantari{background:radial-gradient(circle at 50% 30%,#bffff6,#2fd8c8 50%,#0a5a5a);border-radius:50% 50% 25% 25%}
.ic-pismis_et{background:radial-gradient(circle at 40% 40%,#e0a060,#8a4a1a 60%,#3a1a06);border-radius:45% 55% 50% 40%}
.ic-sifali_yahni{background:radial-gradient(circle at 50% 40%,#d8f0a0,#8a7a3a 55%,#3a2a10);border-radius:20% 20% 50% 50%}
.ic-ruhlu_et{background:radial-gradient(circle at 40% 40%,#9ff0e8,#8a4a1a 60%,#2a1006);border-radius:45% 55% 50% 40%;box-shadow:0 0 6px #4ff0e0}
.ic.big{width:30px;height:30px}
.foodlist,.reslist{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.foodlist .lbl small,.reslist .lbl small{opacity:.7;font-weight:400}
.irow.food{grid-template-columns:22px auto auto 1fr auto}
.irow.food .heal{font-size:11px;color:#9ff0b0}
.resgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.res{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.25);border-radius:8px;padding:5px 4px;font-size:11px}
.res b{font-size:11px}
.res.none{opacity:.45}
.recipes{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.recipe{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.28);border-radius:10px;padding:6px 8px}
.recipe .rinfo b{font-size:14px}
.recipe .needs{font-size:11px;margin:2px 0}
.recipe .need{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.recipe .need .ic{width:12px;height:12px}
.recipe .need.miss{color:#ff8a7a}
.recipe small{font-size:11px;color:#9ff0b0}
.note.ok{color:#9ff0b0;font-weight:700;opacity:1}
.panel.cook .pbox{border-color:#f0a040}
.btn.dim{opacity:.6}
#ui > .panel{z-index:30}
.panel.cook .pbox{width:min(800px,96vw)}

.cookgrid .recipes{margin-top:4px}
.cookgrid .recipe{padding:4px 8px}
.cookgrid .foodlist{margin-top:0}
.cookgrid .resgrid{grid-template-columns:repeat(2,1fr)}
.panel.cook .pbody>.note{margin-bottom:4px}

/* Kamp paneli: kısa ekranda her sütun kendi içinde kayar, "Ye" düğmesi hep erişilebilir */
.panel.cook .pbox{max-height:calc(100vh - 16px);overflow:auto;-webkit-overflow-scrolling:touch}
.cookgrid>*{max-height:calc(100vh - 110px);overflow:auto}
.panel.cook ~ .gather,.panel.cook ~ .campb{visibility:hidden}

/* ===== v4.1 Ruh Çekirdeği ===== */
.cico{display:inline-block;width:12px;height:16px;vertical-align:-3px;margin-right:5px;background:radial-gradient(circle at 40% 35%,#fff 0,var(--c) 45%,rgba(0,0,0,.6) 100%);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);filter:drop-shadow(0 0 4px var(--c))}
.cico.sm{width:10px;height:13px}

.btn .pbadge{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:#e33;color:#fff;font-style:normal;font-size:11px;line-height:18px}
.btn.coreb{background:linear-gradient(#5a3fb0,#2c1c6a);border-color:#1a0f44}
.panel.cores .pbox{width:min(760px,96vw);max-height:calc(100vh - 12px)}
.panel.cores .pbody{overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.chead{display:flex;justify-content:space-between;font-size:12px;gap:8px}.chead .pity{color:#ffcf7a}
.pendbar{display:flex;align-items:center;justify-content:space-between;background:rgba(220,60,60,.25);border:1px solid rgba(255,120,120,.5);border-radius:8px;padding:3px 8px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ccard{background:rgba(0,0,0,.3);border:1px solid rgba(224,176,74,.35);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.ccard .ct b{font-size:13px}.ccard .cn{display:flex;justify-content:space-between;opacity:.85}.ccard .cm{font-size:11px;min-height:28px}.ccard .cm em{color:#ffcf7a;font-style:normal}
.ccard .crow,.rcard .crow{display:flex;gap:4px;flex-wrap:wrap}.ccard .crow .btn{flex:1;padding:0 4px;font-size:12px}
.muhur,.deprow{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px}.muhur small{opacity:.75}
.odds summary{cursor:pointer;font-size:12px;color:#9fd0ff}.odds table{width:100%;font-size:11px;border-collapse:collapse;margin-top:3px}.odds td,.odds th{border-bottom:1px solid rgba(255,255,255,.12);padding:2px 4px;text-align:center}.odds small{font-size:10px;opacity:.75}
.grade.myth{background:linear-gradient(135deg,#ff4f7a,#8a2be2);color:#fff;box-shadow:0 0 10px #d0306a}
.mytag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:rgba(208,48,106,.35);border:1px solid #d0306a;font-size:11px;color:#ffc0d8}
/* karar kartı */
#ui .scr.decide,#ui .scr.summary{display:flex;align-items:center;justify-content:flex-end;padding-right:calc(14px + var(--safe-r))}
.dbox{width:min(330px,46vw);max-height:calc(100vh - 16px);overflow:auto;background:linear-gradient(rgba(27,42,82,.94),rgba(17,26,51,.94));border:2px solid var(--gold);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;animation:fadein .25s}
.dbox.myth{border-color:#d0306a;box-shadow:0 0 18px rgba(208,48,106,.6)}
.dsrc{font-size:11px;opacity:.75;letter-spacing:.5px;text-transform:uppercase}
.dname{display:flex;align-items:center;gap:2px;font-size:19px}.dname b{color:#fff;text-shadow:0 0 10px var(--c)}
.drole{font-size:12px;opacity:.85}.dch{font-size:12px;padding-left:16px;opacity:.9}.dch small{opacity:.7}
.dinfo{display:flex;flex-direction:column;gap:2px;font-size:12px;background:rgba(0,0,0,.25);border-radius:8px;padding:5px 8px}.dinfo b{color:#ffe08a}
.drow{display:flex;gap:6px}.drow .btn{flex:1}
.btn.feedb{background:linear-gradient(#2fb7c9,#16607a);border-color:#0a3a4a}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.25);box-shadow:none;font-weight:600;opacity:.85}
.conf{font-size:13px;line-height:1.4;background:rgba(120,30,30,.35);border:1px solid rgba(255,120,120,.5);border-radius:8px;padding:6px 8px}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rcard{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.15);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:12px;cursor:pointer}
.rcard b{font-size:13px}.rcard.active{border-color:#6fd7ff;opacity:.75}.rcard.active em{color:#6fd7ff;font-style:normal;font-size:11px}.rcard small{opacity:.7}

.rcard.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.sbox{width:min(560px,70vw);max-height:calc(100vh - 16px);overflow:auto;background:linear-gradient(rgba(27,42,82,.95),rgba(17,26,51,.95));border:2px solid var(--gold);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.feedgain{position:absolute;transform:translate(-50%,-50%)}

.fieldrev .ahint{font-size:13px;opacity:.9}
